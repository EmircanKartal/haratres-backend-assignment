name: Java CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - run: java -jar target/assessment.jar --help
      - run: docker build -t haratres-assessment .
      - run: docker run --rm haratres-assessment --help
